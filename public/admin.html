<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng Xếp Hạng · Lưới Lửa Tri Thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Màn admin để trình chiếu: bảng xếp hạng, bấm vào một người chơi để xem trực tiếp màn hình của họ */
:root {
  --bg: #1C4428; --panel: #285A35; --panel-2: #316C40; --line: #5E9E66;
  --cinnabar: #C8352C; --gold: #E2AE45; --egg: #F3EBD8; --jade: #3F9D6E; --muted: #C4E2C6; --ink: #0B2414;
  --display: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif; --body: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #4A9A5C 0%, #2C6B3C 38%, var(--bg) 78%); color: var(--egg); font-family: var(--body); font-size: clamp(15px, 1.2vw, 22px); padding: 20px max(16px, 2.5vw) 32px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; margin-bottom: 18px; }
.eyebrow { font-size: 0.72em; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 4px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(34px, 3.8vw, 68px); line-height: 1; }
.join { display: flex; align-items: center; }
.join .txt { display: grid; gap: 2px; text-align: right; }
.join span { font-size: 0.8em; color: var(--muted); font-weight: 600; }
.join strong { font-family: var(--display); font-size: clamp(20px, 2vw, 36px); color: var(--gold); word-break: break-all; }
#qr { background: #fff; padding: 6px; border-radius: 6px; line-height: 0; }
#qr:empty { display: none; }
#qr img, #qr canvas { width: clamp(84px, 7vw, 130px); height: auto; display: block; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip b { color: var(--gold); }
.spacer { flex: 1; }
.hint { font-size: 0.8em; color: var(--muted); }
button { font: inherit; font-size: 0.85em; font-weight: 700; color: var(--egg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--egg); }
button.on { border-color: var(--gold); color: var(--gold); }
button.danger { border-color: var(--cinnabar); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: rgba(28, 68, 40, 0.78); }
table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 0.7em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid rgba(94, 158, 102, 0.4); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.rank { font-family: var(--display); font-weight: 800; font-size: 1.5em; color: var(--muted); width: 2.4em; }
/* Top 3: khung vàng, bạc, đồng bọc quanh cả hàng */
tr.top1 { --m: #F2C230; --mt: rgba(242, 194, 48, 0.16); }
tr.top2 { --m: #D3DAE1; --mt: rgba(211, 218, 225, 0.12); }
tr.top3 { --m: #D0925A; --mt: rgba(208, 146, 90, 0.14); }
tr.top1 td, tr.top2 td, tr.top3 td { background: var(--mt); border-top: 3px solid var(--m); border-bottom: 3px solid var(--m); }
tr.top1 td:first-child, tr.top2 td:first-child, tr.top3 td:first-child { border-left: 3px solid var(--m); border-radius: 12px 0 0 12px; }
tr.top1 td:last-child, tr.top2 td:last-child, tr.top3 td:last-child { border-right: 3px solid var(--m); border-radius: 0 12px 12px 0; }
tr.top1 .rank, tr.top2 .rank, tr.top3 .rank { color: var(--m); }
.medal { display: inline-grid; place-items: center; width: 1.75em; height: 1.75em; border-radius: 50%; background: var(--m); color: #1B140A; font-size: 0.8em; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25), 0 0 14px var(--m); }
/* Chuỗi đúng từ 4 câu: tên bốc lửa */
.fireName { background: linear-gradient(0deg, #FF4A1F, #FF9A3C 45%, #FFE29A); -webkit-background-clip: text; background-clip: text; color: transparent; animation: glow 0.9s ease-in-out infinite alternate; filter: drop-shadow(0 0 6px rgba(255, 120, 30, 0.7)); }
@keyframes glow { from { filter: drop-shadow(0 0 4px rgba(255, 110, 30, 0.55)); } to { filter: drop-shadow(0 0 12px rgba(255, 150, 40, 0.95)); } }
.streak { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; padding: 1px 9px 1px 4px; border-radius: 999px; background: linear-gradient(90deg, rgba(255, 90, 30, 0.35), rgba(255, 170, 50, 0.15)); border: 1px solid rgba(255, 150, 60, 0.7); color: #FFD27A; font-weight: 800; font-size: 0.8em; vertical-align: middle; -webkit-text-fill-color: #FFD27A; }
.flame { width: 1.25em; height: 1.4em; transform-origin: 50% 100%; animation: flick 0.35s ease-in-out infinite alternate; }
.flame .in { animation: flick2 0.25s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(0.92, 1.1) rotate(3deg); } }
@keyframes flick2 { from { transform: scale(1, 0.9); } to { transform: scale(0.9, 1.08); } }
tr.fire:not(.top1):not(.top2):not(.top3) td:first-child { box-shadow: inset 4px 0 0 #FF7A2F; }
.sparks { position: relative; display: inline-block; }
.sparks i { position: absolute; bottom: 60%; width: 4px; height: 4px; border-radius: 50%; background: #FFB347; opacity: 0; animation: rise 1.4s linear infinite; }
.sparks i:nth-child(1) { left: 10%; animation-delay: 0s; } .sparks i:nth-child(2) { left: 45%; animation-delay: 0.45s; } .sparks i:nth-child(3) { left: 80%; animation-delay: 0.9s; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-26px) scale(0.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flame, .flame .in, .sparks i, .fireName { animation: none; } }
.who { display: grid; gap: 2px; }
.who strong { font-size: 1.1em; }
.who > span { font-size: 0.78em; color: var(--muted); }
.who strong { white-space: nowrap; }
.prog { display: grid; gap: 5px; min-width: 150px; }
.bar { height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.stage { font-size: 0.82em; color: var(--muted); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 0.8em; font-weight: 800; }
.badge.win { background: var(--jade); color: #fff; }
.badge.lose { background: var(--cinnabar); color: #fff; }
.hearts { color: #FF5A4E; letter-spacing: 1px; white-space: nowrap; font-size: 1.05em; }
.hearts s { color: rgba(255, 255, 255, 0.22); text-decoration: none; }
.score { font-family: var(--display); font-weight: 800; font-size: 1.35em; }
.best { font-family: var(--display); font-weight: 800; font-size: 1.35em; color: var(--gold); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--muted); white-space: nowrap; }
.live i { width: 10px; height: 10px; border-radius: 50%; background: #789A7C; flex: none; }
.live.on i { background: #5BE08A; box-shadow: 0 0 8px #5BE08A; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.err { color: #FF8A7E; font-weight: 600; }

[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">Lưới Lửa Tri Thức</div><h1>Bảng Xếp Hạng</h1></div>
  <div class="join"><strong id="joinUrl" hidden></strong><div id="qr"></div></div>
</header>

<div class="chips">
  <span class="chip">Người chơi <b id="cAll">0</b></span>
  <span class="chip">Đang chơi <b id="cLive">0</b></span>
  <span class="spacer"></span>
  <button id="sortBest" class="on">Điểm cao nhất</button>
  <button id="sortNow">Điểm hiện tại</button>
  <button id="resetBtn" class="danger">Xóa dữ liệu</button>
  <span id="confirmBox" hidden><span>Xóa hết người chơi?</span> <button id="confirmYes" class="danger">Xóa</button> <button id="confirmNo">Thôi</button></span>
</div>

<div class="wrap">
  <table>
    <thead><tr><th>#</th><th>Người chơi</th><th>Tiến độ</th><th>Mạng</th><th class="num">Điểm</th><th class="num">Cao nhất</th><th>Trạng thái</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">Chưa có ai vào chơi. Người chơi quét mã ở góc trên, nhập tên rồi chơi.</td></tr></tbody>
  </table>
</div>
<p id="err" class="err" hidden></p>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Math.round(n || 0).toLocaleString("vi-VN");
const fmtTime = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
const hearts = (p) => p.maxHp ? "♥".repeat(Math.max(0, p.hp)) + `<s>${"♥".repeat(Math.max(0, p.maxHp - Math.max(0, p.hp)))}</s>` : "–";
let sortKey = "best", needKey = false, last = null, order = [];

// trên Vercel (https) luôn dùng chính địa chỉ trang này; chạy trên laptop thì dùng địa chỉ Wi-Fi máy chủ báo về
const onWeb = location.protocol === "https:";
fetch("api/info").then((r) => r.json()).then((d) => setJoin(onWeb || !d.urls[0] ? location.origin : d.urls[0], !!d.needKey)).catch(() => setJoin(location.origin, false));
function setJoin(url, nk) {
  needKey = nk;
  $("joinUrl").textContent = url.replace(/^https?:\/\//, "");
  try { $("qr").innerHTML = ""; new QRCode($("qr"), { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
}

const FLAME = `<svg class="flame" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 1c1 4 6 6.5 6 12.5A6 6 0 0 1 4 13.5C4 10 6 8.5 6.5 6c1.5 1.5 2 3 2 4.5C10 9 10.5 5 10 1z" fill="#FF6A1F"/><path class="in" d="M10 9.5c.6 2.4 3.4 3.6 3.4 6.8a3.4 3.4 0 0 1-6.8 0c0-1.9 1-2.8 1.3-4.2.8.8 1.1 1.7 1.1 2.6.9-1 1.3-3 1-5.2z" fill="#FFD27A"/></svg>`;
const isOn = (p, now) => now - p.lastSeen < 15000 && !p.result;
function stageCell(p) {
  if (p.result === "win") return `<span class="badge win">Hạ B-52</span> <span class="stage">${fmtTime(p.sec)}</span>`;
  if (p.result === "lose") return `<span class="badge lose">${p.stageName === "Rời trận" ? "Rời trận" : p.hp <= 0 ? "Hết mạng" : "Hết câu"}</span> <span class="stage">câu ${p.stage}/${p.stages}</span>`;
  const pct = p.stages ? Math.round(100 * (p.stage - 1) / p.stages) : 0;
  return `<div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><span class="stage">Câu ${p.stage}/${p.stages} · ${esc(p.stageName)}</span></div>`;
}
function statusText(p, now) {
  const ago = Math.round((now - p.lastSeen) / 1000);
  if (isOn(p, now)) return "Đang chơi";
  if (now - p.lastSeen < 15000) return "Xong lượt";
  return ago < 3600 ? `Rời ${Math.max(1, Math.round(ago / 60))} phút trước` : "Đã rời";
}

function draw(data) {
  const now = data.now;
  const list = data.players.slice().sort((a, b) => sortKey === "best"
    ? (Math.max(b.best, b.score) - Math.max(a.best, a.score)) || (b.score - a.score)
    : (b.score - a.score) || (b.best - a.best));
  order = list.map((p) => p.id);
  $("cAll").textContent = list.length;
  $("cLive").textContent = list.filter((p) => isOn(p, now)).length;
  if ($("cWin")) $("cWin").textContent = list.filter((p) => p.wins > 0).length;
  if (!list.length) return;
  $("rows").innerHTML = list.map((p, i) => {
    const on = isOn(p, now);
    const fire = on && (p.streak || 0) >= 4; // đang chơi và đúng liên tiếp từ 4 câu
    const nameHtml = fire
      ? `<span class="sparks"><strong class="fireName">${esc(p.name)}</strong><i></i><i></i><i></i></span><span class="streak">${FLAME}×${p.streak}</span>`
      : `<strong>${esc(p.name)}</strong>`;
    return `<tr data-id="${esc(p.id)}" class="${i < 3 ? `top${i + 1}` : ""} ${on ? "on" : ""} ${fire ? "fire" : ""}">
      <td class="rank">${i < 3 ? `<span class="medal">${i + 1}</span>` : i + 1}</td>
      <td><div class="who"><div>${nameHtml}</div><span>đúng ${p.correct}, sai ${p.wrong}</span></div></td>
      <td>${stageCell(p)}</td>
      <td class="hearts">${hearts(p)}</td>
      <td class="num score">${fmt(p.score)}</td>
      <td class="num best">${p.best ? fmt(p.best) : "–"}</td>
      <td><span class="live ${on ? "on" : ""}"><i></i>${statusText(p, now)}</span></td>
    </tr>`;
  }).join("");
}

async function poll() {
  try {
    const r = await fetch("api/players", { cache: "no-store" });
    last = await r.json();
    draw(last);
    // trên web mà chưa nối Redis thì điểm chỉ lưu tạm, báo để người trình chiếu biết
    const temp = location.protocol === "https:" && last.persistent === false;
    $("err").textContent = temp ? "Chưa kết nối Redis: điểm chỉ lưu tạm và có thể mất." : "";
    $("err").hidden = !temp;
  } catch (e) {
    $("err").textContent = "Mất kết nối tới server, đang thử lại…";
    $("err").hidden = false;
  }
}
poll();
setInterval(poll, 2000);

/* ---------- Sắp xếp, xóa dữ liệu ---------- */
function setSort(k) { sortKey = k; $("sortBest").classList.toggle("on", k === "best"); $("sortNow").classList.toggle("on", k === "now"); if (last) draw(last); }
$("sortBest").onclick = () => setSort("best");
$("sortNow").onclick = () => setSort("now");
$("resetBtn").onclick = () => { $("confirmBox").hidden = false; $("resetBtn").hidden = true; };
$("confirmNo").onclick = () => { $("confirmBox").hidden = true; $("resetBtn").hidden = false; };
$("confirmYes").onclick = async () => {
  const headers = {};
  try { const k = sessionStorage.getItem("adminKey") || (needKey ? prompt("Nhập mật khẩu admin (ADMIN_KEY):") : ""); if (k) { sessionStorage.setItem("adminKey", k); headers["x-admin-key"] = k; } } catch (e) {}
  const rr = await fetch("api/reset", { method: "POST", headers }).catch(() => null);
  $("confirmBox").hidden = true; $("resetBtn").hidden = false;
  if (rr && rr.status === 401) { try { sessionStorage.removeItem("adminKey"); } catch (e) {} alert("Sai mật khẩu admin."); return; }
  $("rows").innerHTML = '<tr><td colspan="7" class="empty">Đã xóa dữ liệu. Chờ người chơi vào.</td></tr>';
  poll();
};
</script>
</body>
</html>
