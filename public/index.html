<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C4428">
<title>Lưới Lửa Tri Thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@800;900&family=Be+Vietnam+Pro:wght@500;700;800&display=swap">
<style>
:root {
  --bg: #1C4428; --panel: #285A35; --panel-2: #316C40; --line: #5E9E66;
  --cinnabar: #C8352C; --gold: #E2AE45; --egg: #F3EBD8; --jade: #3F9D6E; --muted: #C4E2C6; --ink: #0B2414;
  --display: "Alegreya", Georgia, serif; --body: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--egg); font-family: var(--body); }
body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: crosshair; }
button { font: inherit; cursor: pointer; }
.top { position: fixed; display: flex; gap: 6px; z-index: 5; }
.icon { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: rgba(40, 90, 53, 0.85); color: var(--egg); font-size: 14px; font-weight: 800; padding: 0; display: grid; place-items: center; }
.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 0%, #4E9A5C 0%, #2E6E3C 35%, rgba(22, 56, 32, 0.97) 75%); }
.screen.dim { background: rgba(8, 28, 14, 0.78); }
.card { width: min(380px, 100%); display: grid; gap: 14px; text-align: center; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(38px, 11vw, 54px); line-height: 0.95; }
h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; }
input { font: inherit; font-size: 17px; font-weight: 700; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--egg); text-align: center; width: 100%; }
input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn { font-size: 18px; font-weight: 800; padding: 13px 18px; border-radius: 6px; border: 0; background: var(--gold); color: var(--ink); box-shadow: 0 4px 0 #9C7322; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9C7322; }
.btn.ghost { background: var(--panel-2); color: var(--egg); box-shadow: 0 4px 0 #1C4428; border: 1px solid var(--line); }
.btn.red { background: var(--cinnabar); color: #fff; box-shadow: 0 4px 0 #7A1E18; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.tips { display: grid; gap: 2px; margin: 2px 0; text-align: left; background: rgba(40, 90, 53, 0.7); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
.tip { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 15px; padding: 5px 0; }
.tip svg { flex: none; }
.best { font-size: 13px; color: var(--muted); font-weight: 700; }
.big { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
.stat b { color: var(--gold); }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick { display: grid; gap: 6px; align-content: start; padding: 16px 8px; border-radius: 8px; border: 2px solid var(--gold); background: var(--panel-2); color: var(--egg); text-align: center; box-shadow: 0 4px 0 #0B2414; }
.pick:active { transform: translateY(2px); }
.pick:focus-visible { outline: 3px solid var(--egg); }
.pick b { font-family: var(--display); font-size: 20px; font-weight: 900; color: var(--gold); line-height: 1.1; }
.pick span { font-size: 14px; font-weight: 700; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top" id="top" hidden>
  <button class="icon" id="muteBtn" aria-label="Tắt/bật âm thanh">♪</button>
  <button class="icon" id="leaveBtn" aria-label="Rời trận">✕</button>
</div>

<div class="screen" id="startScr">
  <div class="card">
    <h1>Lưới Lửa<br>Tri Thức</h1>
    <div class="tips">
      <div class="tip"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="20" r="5" fill="#E2AE45"/><path d="M13 15 L20 4" stroke="#F3EBD8" stroke-width="2" stroke-dasharray="2 3"/></svg>Kéo để ngắm, súng tự bắn</div>
      <div class="tip"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="4" y="6" width="18" height="15" rx="2" fill="#4FA877" stroke="#1E4D35" stroke-width="1.5"/><path d="M8 13.5l3.5 3.5L18 10" stroke="#fff" stroke-width="2.4" fill="none"/></svg>Bắn vỡ thùng đáp án đúng</div>
      <div class="tip"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="2" y="2" width="22" height="8" rx="2" fill="#C8352C"/><rect x="2" y="13" width="8" height="7" fill="#4A5470"/><rect x="16" y="13" width="8" height="7" fill="#4A5470"/><circle cx="13" cy="17" r="3" fill="#E2AE45"/></svg>Bắn qua khe hở vào địch</div>
      <div class="tip"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="5" y="3" width="12" height="9" rx="1.5" fill="#C08A4A" stroke="#4A2E14" stroke-width="1.2"/><path d="M11 14v4M8 15l-1 3M14 15l1 3" stroke="#FF6B5E" stroke-width="1.6"/><circle cx="11" cy="22" r="3" fill="#E2AE45"/></svg>Thùng sai rơi xuống, mất 1 mạng</div>
      <div class="tip"><svg width="26" height="26" viewBox="0 0 26 26"><g transform="rotate(35 16 9)"><path d="M13 3 L19 3 L18 6 L14 6 Z" fill="#2E3524"/><ellipse cx="16" cy="10" rx="3.6" ry="6" fill="#5E6B40"/><rect x="12.4" y="11.5" width="7.2" height="1.6" fill="#E2B23A"/></g><circle cx="7" cy="21" r="4" fill="#E2AE45"/><path d="M9 18 L12 15" stroke="#F3EBD8" stroke-width="2"/></svg>Bắn chặn bom của B-52</div>
      <div class="tip"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="2" y="7" width="22" height="13" rx="3" fill="#FF9A3C"/><text x="13" y="17.5" font-size="10" font-weight="800" text-anchor="middle" fill="#1B0E04" font-family="sans-serif">×2</text></svg>Đúng liên tiếp: nhân điểm, nhận viện trợ</div>
    </div>
    <input id="nameInp" maxlength="24" placeholder="Tên của bạn" autocomplete="off">
    <button class="btn" id="playBtn">Chơi</button>
    <div class="best" id="bestTxt"></div>
  </div>
</div>

<div class="screen" id="endScr" hidden>
  <div class="card">
    <div class="eyebrow" id="endEyebrow"></div>
    <h2 id="endTitle"></h2>
    <div class="big" id="endScore">0</div>
    <div class="stats" id="endStats"></div>
    <div class="best" id="endBest"></div>
    <button class="btn" id="againBtn">Chơi lại</button>
  </div>
</div>

<div class="screen dim" id="pickScr" hidden>
  <div class="card">
    <div class="eyebrow" id="pickEyebrow"></div>
    <h2>Viện trợ</h2>
    <div class="picks" id="picks"></div>
  </div>
</div>

<div class="screen dim" id="leaveScr" hidden>
  <div class="card">
    <h2>Rời trận?</h2>
    <div class="row"><button class="btn ghost" id="stayBtn">Ở lại</button><button class="btn red" id="quitBtn">Rời</button></div>
  </div>
</div>

<script>
/* =====================================================================
   SỬA CÂU HỎI Ở ĐÂY
   Mỗi câu: q = câu hỏi, a = các đáp án, correct = vị trí đáp án đúng (đếm từ 0).
   Số thùng đáp án theo CONFIG.lanes: câu 1-5 có 4 thùng (đáp án ngắn, thừa đáp án sai thì bỏ bớt ngẫu nhiên),
   câu 6-15 vẫn 4 thùng nhưng to hơn (dành cho đáp án dài, tối đa khoảng 55 ký tự),
   câu 16-20 có 6 thùng (đáp án ngắn; nên cho đủ 6 đáp án, thiếu thì thành thùng rỗng).
   Đáp án đúng có thể để ở vị trí nào cũng được, game tự xáo thứ tự các thùng.
   ===================================================================== */
const QUESTIONS = [
  // ── Chặng 1 (1 máy bay, 4 thùng): đáp án ngắn ──
  { q: "Đại hội đại biểu toàn quốc lần thứ V của Đảng họp vào thời gian nào?", a: ["3/1982", "12/1976", "12/1986", "7/1984"], correct: 0 },
  { q: "Đại hội V của Đảng họp ở đâu?", a: ["Hà Nội", "TP Hồ Chí Minh", "Huế", "Đà Nẵng"], correct: 0 },
  { q: "Tổng Bí thư của Đảng tại thời điểm Đại hội V là ai?", a: ["Lê Duẩn", "Trường Chinh", "Nguyễn Văn Linh", "Phạm Văn Đồng"], correct: 0 },
  { q: "Đại hội V xác định ngành nào là mặt trận hàng đầu?", a: ["Nông nghiệp", "Công nghiệp nặng", "Thương nghiệp", "Giao thông"], correct: 0 },
  { q: "Theo Đại hội V, chặng đường đầu tiên của thời kỳ quá độ kéo dài đến năm nào?", a: ["1990", "1985", "1986", "2000"], correct: 0 },
  // ── Chặng 2 (2 máy bay, vẫn 4 thùng nhưng thùng to hơn): đáp án dài ──
  { q: "Theo Đại hội V, nhiệm vụ của chặng đường trước mắt là gì?", a: ["Ổn định, cải thiện đời sống nhân dân", "Xóa bỏ kinh tế nhiều thành phần", "Ưu tiên tuyệt đối công nghiệp nặng", "Hoàn thành công nghiệp hóa"], correct: 0 },
  { q: "Về đối ngoại, Đại hội V coi quan hệ với nước nào là hòn đá tảng?", a: ["Liên Xô", "Trung Quốc", "Lào", "Cu Ba"], correct: 0 },
  { q: "Đâu là một hạn chế của Đại hội V?", a: ["Chưa thừa nhận kinh tế nhiều thành phần", "Coi nông nghiệp là mặt trận hàng đầu", "Kêu gọi các nước ASEAN đối thoại", "Giữ vững an ninh quốc phòng"], correct: 0 },
  { q: "Hội nghị Trung ương 6 (7/1984) chủ trương gì?", a: ["Đẩy mạnh thu mua, quản lý chặt thị trường tự do", "Đổi tiền: 10 đồng cũ lấy 1 đồng mới", "Bầu Tổng Bí thư mới", "Gia nhập Liên Hợp Quốc"], correct: 0 },
  { q: "Hội nghị Trung ương 7 (12/1984) xác định trước hết phải làm gì?", a: ["Sản xuất lương thực, thực phẩm", "Đầu tư công nghiệp nặng", "Đẩy mạnh xuất khẩu dầu mỏ", "Tổng điều chỉnh giá – lương"], correct: 0 },
  { q: "Hội nghị Trung ương 8 (6/1985) chủ trương xóa bỏ cơ chế nào?", a: ["Tập trung quan liêu, hành chính, bao cấp", "Kinh tế nhiều thành phần", "Hạch toán kinh doanh XHCN", "Phân cấp quản lý cho địa phương"], correct: 0 },
  { q: "Sai lầm khi thực hiện Hội nghị Trung ương 8 (6/1985) là gì?", a: ["Vội vàng đổi tiền, tổng điều chỉnh giá – lương", "Không thừa nhận sản xuất hàng hóa", "Giữ nguyên cơ chế bao cấp", "Không bù giá vào lương"], correct: 0 },
  { q: "Bước đột phá thứ ba (Bộ Chính trị, 8/1986) tập trung vào 3 chương trình nào?", a: ["Lương thực, hàng tiêu dùng, hàng xuất khẩu", "Công nghiệp nặng, quốc phòng, giao thông", "Dầu khí, thép, xi măng", "Giáo dục, y tế, văn hóa"], correct: 0 },
  { q: "Hội nghị Bộ Chính trị (8/1986) coi gì là đặc trưng của thời kỳ quá độ?", a: ["Kinh tế nhiều thành phần", "Kinh tế tập trung, bao cấp", "Chỉ có kinh tế quốc doanh", "Kinh tế tự cung tự cấp"], correct: 0 },
  { q: "Theo tổng kết 1975 – 1986, nguyên nhân chủ quan của khủng hoảng là gì?", a: ["Sai lầm đánh giá tình hình, bố trí cơ cấu kinh tế", "Hậu quả nặng nề của 30 năm chiến tranh", "Chiến tranh bảo vệ biên giới hai đầu đất nước", "Mỹ bao vây, cấm vận"], correct: 0 },
  // ── Chặng 3 (3 máy bay, 6 thùng): đáp án ngắn ──
  { q: "Tổng Bí thư Lê Duẩn qua đời vào ngày nào?", a: ["10/7/1986", "14/7/1986", "27/3/1982", "14/9/1985", "20/9/1977", "30/4/1975"], correct: 0 },
  { q: "Ngày 14/7/1986, ai được bầu giữ chức Tổng Bí thư?", a: ["Trường Chinh", "Lê Duẩn", "Nguyễn Văn Linh", "Phạm Văn Đồng", "Võ Nguyên Giáp", "Đỗ Mười"], correct: 0 },
  { q: "Đổi tiền ngày 14/9/1985: bao nhiêu đồng cũ đổi 1 đồng mới?", a: ["10 đồng", "100 đồng", "5 đồng", "1000 đồng", "2 đồng", "50 đồng"], correct: 0 },
  { q: "Việt Nam chính thức trở thành thành viên Liên Hợp Quốc năm nào?", a: ["1977", "1975", "1976", "1982", "1986", "1995"], correct: 0 },
  { q: "Bước đột phá thứ hai trong đổi mới kinh tế là hội nghị nào?", a: ["Trung ương 8 (6/1985)", "Trung ương 6 (7/1984)", "Trung ương 7 (12/1984)", "Bộ Chính trị (8/1986)", "Đại hội V (3/1982)", "Đại hội IV (12/1976)"], correct: 0 },
];

/* ---------------- CẤU HÌNH ---------------- */
const CONFIG = {
  lanes: [{ from: 1, n: 4 }, { from: 6, n: 4, w: 5, h: 104 }, { from: 16, n: 6 }], // LÀN ĐƯỜNG: từ câu "from" có "n" thùng; "w" = bề rộng làn (tính theo số ô), "h" = chiều cao thùng
  laneW: 84,              // bề rộng mỗi ô đáp án
  testAnswers: false,     // CHẾ ĐỘ TEST: đáp án đúng ghi "Đúng", còn lại ghi "Sai". Đổi thành false khi chơi thật
  shuffleAnswers: true,   // xáo vị trí 5 đáp án
  shuffleQuestions: false,// xáo thứ tự câu hỏi
  hearts: 5,              // số mạng
  fireRate: 1.5,          // số viên súng tự bắn mỗi giây (bắn liên tục, không giới hạn đạn)
  ballSpeed: 720,
  bounceJitter: 0.1,      // độ lệch ngẫu nhiên khi bóng nảy (radian, 0 = nảy chuẩn)
  blockHp: 5,             // số phát để vỡ một ô đáp án
  wallSpeed: 9,           // tốc độ ô đáp án rơi xuống
  shieldTime: 0,          // số giây đầu mỗi câu đá chưa vỡ được (0 = bắn vỡ được ngay)
  bombHp: 3,              // số phát phải bắn trúng một quả bom mới nổ
  fireballR: 20,          // cỡ quả bom B-52 thả xuống
  fireball2From: 8,       // từ câu số này B-52 thả 2 quả bom một lần
  fireball3From: 15,      // từ câu số này B-52 thả 3 quả bom một lần
  enemyShotSpeed: 380,    // tốc độ bóng đỏ khi hàng đá chạm vạch đỏ
  bossThrowFrom: 5,       // BOSS PHẢN CÔNG: số giây giữa 2 lần thả bom ở câu đầu...
  bossThrowTo: 3.5,       // ...và ở các câu cuối (thả dày dần)
  bossThrowSpeed: 110,    // bom rơi chậm để người chơi kịp bắn đủ 3 phát
  finalSpeed: 1.5,        // CÂU CUỐI: đá rơi nhanh gấp 1.5 lần
  finalMult: 2,           // CÂU CUỐI: điểm nhân 2
  burnTime: 2,            // đạn lửa: số giây địch bị cháy
  burnTick: 0.4,          // cứ bấy nhiêu giây cháy mất 1 máu
  musicVolume: 0.1,       // âm lượng nhạc nền (0 = tắt nhạc)
  engineVolume: 1,        // âm lượng tiếng động cơ máy bay (0 = tắt)
  afterBreak: 2,          // phá giáp xong còn bấy nhiêu giây bắn thêm lấy điểm rồi sang câu mới
  attackTime: 11,         // số giây được tấn công qua khe hở (cùng với số câu quyết định độ dài ván, ~8 phút với 15 câu)
  bossHpPerQuestion: 45,  // máu địch cho mỗi câu (tổng máu = số câu × giá trị này)
};
const SCORING = {
  correct: 300,           // mỗi câu đúng
  speedMax: 200,          // thưởng trả lời nhanh, giảm dần về 0 sau speedTime giây
  speedTime: 20,
  damage: 5,              // mỗi phát trúng địch
  bossKill: 1000,         // hạ được địch
  heartLeft: 200,         // mỗi mạng còn lại khi kết thúc
  perfect: 1500,          // đúng hết tất cả các câu
  multStep: 0.5,          // hệ số điểm: cứ 2 câu đúng liên tiếp thì +0.5 (×1, ×1.5, ×2, ...)
  multMax: 3,             // hệ số tối đa
  blockShot: 50,          // bắn chặn được 1 quả bóng đỏ
};
/* VIỆN TRỢ: khi chuỗi câu đúng liên tiếp chạm mốc trong UPGRADE_AT hoặc đúng câu thưởng, game dừng lại cho chọn 1 trong 3 thẻ:
   luôn có "Tăng tốc độ bắn" (hết lượt thì thay bằng Liên thanh) và "Hồi máu", thẻ thứ ba ngẫu nhiên trong các thẻ còn lại.
   Mỗi mốc chỉ nhận 1 lần, viện trợ giữ đến hết ván. Sai hoặc để đá chạm vạch đỏ thì chuỗi về 0, hệ số điểm về ×1. */
const UPGRADE_AT = [3, 5];                 // chuỗi đúng liên tiếp lần đầu đạt 3 và 5
const UPGRADE_QUESTIONS = [5, 11, 17];      // CÂU THƯỞNG: trả lời đúng các câu số này (đếm từ 1) được chọn viện trợ
const UPGRADES = [
  { id: "fast",   name: "Tăng tốc độ bắn", desc: "+50% tốc độ bắn",    max: 3, apply: (S) => { S.fireRate += CONFIG.fireRate * 0.5; } },
  { id: "multi",  name: "Liên thanh", desc: "Bắn nhanh gấp đôi",        max: 1, apply: (S) => { S.fireRate += CONFIG.fireRate; } },
  { id: "fire",   name: "Đạn lửa",   desc: "×2 sát thương, đốt cháy địch", max: 1, apply: (S) => { S.power = 2; } },
  { id: "big",    name: "Đạn to",    desc: "Bóng to, dễ chặn bóng đỏ", max: 1, apply: (S) => { S.ballR = 9; } },
  { id: "heart",  name: "Hồi máu",   desc: "Hồi 1 mạng",               max: 99, apply: (S) => { S.hearts++; } },
  { id: "shield", name: "Khiên",     desc: "Đỡ 1 lần bị đánh trúng",   max: 3, apply: (S) => { S.shield++; } },
];

/* ---------------- Màn hình & bố cục ---------------- */
let W = 420; let H = 760; const BASE_W = 420;
const L = {};

/* Xuống dòng và co chữ cho vừa khung */
const fitCache = new Map();
function fitText(text, maxW, maxH, big, small, weight) {
  const key = `${text}|${maxW}|${maxH}|${big}|${small}|${weight}`;
  if (fitCache.has(key)) return fitCache.get(key);
  let res = null;
  for (let size = big; size >= small; size--) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    const lines = wrap(text, maxW);
    const lh = size * 1.22;
    if (lines.length * lh <= maxH && lines.every((l) => ctx.measureText(l).width <= maxW)) { res = { size, lines, lh }; break; }
  }
  if (!res) {
    ctx.font = `${weight} ${small}px ${FONT}`;
    const lh = small * 1.22, max = Math.max(1, Math.floor(maxH / lh));
    let lines = wrap(text, maxW).slice(0, max);
    let last = lines[lines.length - 1];
    while (last.length > 1 && ctx.measureText(last + "…").width > maxW) last = last.slice(0, -1);
    lines[lines.length - 1] = last + "…";
    res = { size: small, lines, lh };
  }
  fitCache.set(key, res);
  return res;
}
function wrap(text, maxW) {
  const words = String(text).split(/\s+/); const lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

let AC = null, muted = false; const lastSfx = {};
function initAudio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(freq, dur, type, vol, slide) {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(kind, p) {
  if (muted || !AC) return;
  const now = performance.now();
  if (now - (lastSfx[kind] || 0) < 35) return;
  lastSfx[kind] = now;
  try {
    if (kind === "hit") tone(420 + (p || 0) * 50, 0.05, "square", 0.025);
    else if (kind === "stone") tone(160, 0.06, "triangle", 0.05);
    else if (kind === "boss") tone(140, 0.09, "sine", 0.12, 70);
    else if (kind === "fire") tone(900, 0.03, "sine", 0.015, 600);
    else if (kind === "good") { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.16, "triangle", 0.08), i * 70)); }
    else if (kind === "bad") tone(180, 0.35, "sawtooth", 0.06, 70);
    else if (kind === "crash") tone(110, 0.5, "sawtooth", 0.08, 40);
    else if (kind === "clink") { tone(1300, 0.06, "square", 0.04, 900); tone(2600, 0.04, "sine", 0.03); }
    else if (kind === "drop") { // cửa khoang bật mở, bom tuột khỏi giá rồi rít dài khi rơi
      tone(160, 0.09, "square", 0.09, 70); noiseBurst(0.12, 0.12, 3000);
      setTimeout(() => { try { tone(2400, 1.4, "sine", 0.07, 300); tone(2420, 1.4, "sine", 0.035, 310); } catch (e) {} }, 120);
    }
    else if (kind === "boom") { noiseBurst(0.7, 0.35, 900); tone(70, 0.5, "sine", 0.2, 28); }
    else if (kind === "win") { [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.25, "triangle", 0.09), i * 110)); }
  } catch (e) {}
}

/* Tiếng động cơ phi đội B-52 ù ù trên trời, to dần theo số máy bay */
let HUM = null;
function updateHum() {
  if (!AC) return;
  try {
    if (!HUM) {
      const g = AC.createGain(); g.gain.value = 0;
      const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 300; lp.Q.value = 2;
      [55, 57.7, 111.3].forEach((f, i) => { const o = AC.createOscillator(); o.type = i < 2 ? "sawtooth" : "triangle"; o.frequency.value = f; o.connect(lp); o.start(); });
      const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
      const ng = AC.createGain(); ng.gain.value = 0.5; ns.connect(ng).connect(lp); ns.start();
      const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.3; lg.gain.value = 80; lfo.connect(lg).connect(lp.frequency); lfo.start();
      lp.connect(g).connect(AC.destination);
      HUM = { g };
    }
    const n = S && S.boss && S.boss.planes ? S.boss.planes.length : 0;
    const on = S && !paused && !S.over && !muted && S.phase !== "dying";
    HUM.g.gain.setTargetAtTime(on ? (0.014 + 0.007 * n) * CONFIG.engineVolume : 0, AC.currentTime, 0.4);
    updateMusic();
  } catch (e) {}
}
let NOISE = null;
/* Nhạc nền căng thẳng (tự tổng hợp, không cần file): giọng La thứ, vòng hợp âm Am - Bb - Am - E.
   Cấp 1 (1 máy bay): trống trận thưa, bass nhịp đen. Cấp 2 (2 máy bay): nhanh hơn, bass móc đơn, thêm trống lẫy.
   Cấp 3 (3 máy bay hoặc câu cuối): nhanh nhất, thêm hi-hat và tiếng dây rung dồn dập. */
let MUS = null;
function getNoise() { if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return NOISE; }
const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
function mNote(t, m, dur, type, vol, cut) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(mf(m), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  if (cut) { const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut; o.connect(f).connect(g); } else o.connect(g);
  g.connect(MUS.out); o.start(t); o.stop(t + dur + 0.02);
}
function mNoise(t, dur, vol, hp) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = getNoise(); f.type = "highpass"; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(MUS.out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function mKick(t, vol) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(g).connect(MUS.out); o.start(t); o.stop(t + 0.3);
}
const CHORDS = [[45, 0, 3, 7], [46, 0, 4, 7], [45, 0, 3, 7], [40, 0, 4, 7]]; // gốc (MIDI) + quãng
function updateMusic() {
  if (!MUS) { MUS = { out: AC.createGain(), next: AC.currentTime + 0.1, step: 0 }; MUS.out.gain.value = 0; MUS.out.connect(AC.destination); }
  const on = S && !paused && !S.over && !muted && S.phase !== "dying";
  MUS.out.gain.setTargetAtTime(on ? CONFIG.musicVolume : 0, AC.currentTime, 0.3);
  if (!on) { MUS.next = AC.currentTime + 0.1; return; }
  const np = S.boss && S.boss.planes ? S.boss.planes.length : 1, lvl = S.lastQ ? 3 : Math.min(3, Math.max(1, np));
  const bpm = [0, 96, 110, 124][lvl] + (S.lastQ ? 8 : 0), dt16 = 60 / bpm / 4;
  while (MUS.next < AC.currentTime + 0.15) {
    const t = MUS.next, st = MUS.step % 16, bar = Math.floor(MUS.step / 16) % 4, [root, ...iv] = CHORDS[bar];
    // trống
    if (st === 0 || st === 8 || (lvl >= 2 && st === 10) || (lvl >= 3 && (st === 3 || st === 11))) mKick(t, 0.9);
    if (lvl === 1 && st === 12) mNote(t, 38, 0.25, "triangle", 0.35);
    if (lvl >= 2 && (st === 4 || st === 12)) { mNoise(t, 0.13, 0.32, 1500); mNote(t, 50, 0.08, "triangle", 0.18); }
    if (lvl >= 2 && st === 15 && bar === 3) mNoise(t, 0.08, 0.25, 1500);
    if (lvl >= 3 && st % 2 === 0) mNoise(t, 0.03, st % 4 ? 0.07 : 0.12, 7000);
    // bass
    const bassOn = lvl === 1 ? st % 4 === 0 : lvl === 2 ? st % 2 === 0 : (st % 2 === 0 || st === 15);
    if (bassOn) mNote(t, root + ((lvl >= 2 && (st === 6 || st === 14)) ? 12 : 0), dt16 * (lvl === 1 ? 3 : 1.6), "sawtooth", 0.32, 520);
    // hợp âm rải phía trên
    if ([0, 3, 6, 10].includes(st)) mNote(t, root + 24 + iv[[0, 1, 2, 1][[0, 3, 6, 10].indexOf(st)]], dt16 * 2.5, "square", 0.05, 2400);
    // dây rung dồn dập ở cấp 3, nhịp đảo ở cấp 2
    if (lvl >= 3) mNote(t, root + 36 + (st % 4 === 2 ? iv[1] : 0), dt16 * 0.8, "sawtooth", 0.035, 3200);
    else if (lvl === 2 && st % 4 === 2) mNote(t, root + 31, dt16 * 0.9, "sawtooth", 0.035, 2800);

function noiseBurst(dur, vol, freq) {
  if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  s.buffer = NOISE; f.type = "lowpass"; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

let S = null, paused = false;
const FIRE_PHASES = ["intro", "fall", "attack"];

function bossFloor() { return Math.max(0, (S.N - S.qi - 1) * CONFIG.bossHpPerQuestion); }
function bossTargetY(qi) { return L.bossStart; } // máy bay giữ nguyên độ cao, đá luôn rơi từ xa để có thời gian suy nghĩ

function startQuestion(i) {
  S.qi = i;
  S.boss.ty = bossTargetY(i);
  L.blockH = blockHFor(i);
  const q = S.qs[i], n = lanesFor(i), bw = W / n;
  // chọn n đáp án: đáp án đúng + (n-1) đáp án sai; thiếu thì thêm ô đá trống
  const right = { t: q.a[q.correct], correct: true };
  const wrong = shuffle(q.a.map((t, k) => ({ t, correct: false, k })).filter((x) => x.k !== q.correct)).slice(0, n - 1);
  let pick = [right, ...wrong];
  pick = CONFIG.shuffleAnswers ? shuffle(pick) : pick.sort((a, b) => (a.correct ? q.correct : a.k) - (b.correct ? q.correct : b.k));
  while (pick.length < n) pick.splice(Math.floor(Math.random() * (pick.length + 1)), 0, { t: "", correct: false, blank: true });
  q.answers = pick.map((x) => ({ text: x.blank ? "" : CONFIG.testAnswers ? (x.correct ? "Đúng" : "Sai") : x.t, real: x.t, correct: x.correct, blank: !!x.blank }));
  S.wall = {
    y: S.boss.ty + L.bossH - L.blockH, from: S.boss.ty + L.bossH - L.blockH, to: S.boss.ty + L.bossH + L.gap,
    blocks: q.answers.map((a, k) => ({ x: k * bw, w: bw, k, ...a, hp: CONFIG.blockHp, max: CONFIG.blockHp, state: a.blank ? "stone" : "live", flash: 0, seed: Math.random() * 1000 })),
    alpha: 1,
  };
  S.phase = "intro"; S.phaseT = 0; S.fallT = 0;
  S.throwT = throwGap() * 0.7;
  S.lastQ = i === S.N - 1 && S.N > 1;
  if (S.lastQ) { S.banner = { title: "Câu cuối!", sub: `B-52 dốc toàn lực · điểm ×${CONFIG.finalMult}`, t: 2.4 }; sfx("bad"); }
  // bóng đang bay ở chỗ hàng ô mới sẽ hiện ra thì biến mất
  // đạn còn bay từ câu trước biến mất, để không bắn vỡ nhầm đá mới
  for (const b of S.balls) burst(b.x, b.y, "#E2AE45", 2, 50);
  S.balls = [];
  sendStatus();
}

function startWiden() {
  S.phase = "widen"; S.phaseT = 0; S.W0 = W; S.W1 = laneWidth(S.qi + 1);
  S.balls = []; S.boss.roar = 1.8;
  S.banner = { title: "Thêm 1 chiếc B-52!", sub: lanesFor(S.qi + 1) === lanesFor(S.qi) ? "Làn đường mở rộng · thùng to hơn" : `Làn đường mở rộng · ${lanesFor(S.qi + 1)} đáp án`, t: 2 };
  sfx("crash"); setTimeout(() => sfx("bad"), 250);
}

function toNext() {
  S.phase = "next"; S.phaseT = 0;
  // bom còn trên trời tự nổ (không mất máu) để sang câu mới ngay
  for (const e of S.eshots) if (!e.blocked && e.delay <= 0) explode(e.x, e.y, 0.7);
  S.eshots = [];
}

function crash() {
  S.phase = "reveal"; S.phaseT = 0;
  S.stats.wrong++; breakStreak();
  for (const b of S.wall.blocks) if (b.state === "live") b.state = b.correct ? "show" : "stone";
  S.shake = 10; sfx("crash");
  bossShoot();
  sendStatus(true);
}

function breakBlock(bl) {
  if (bl.correct) {
    bl.state = "gone";
    // các cục đá còn lại rơi nhanh xuống dưới (không gây mất máu)
    for (const o of S.wall.blocks) if (o.state === "live") {
      o.state = "fallen";
      S.falling.push({ x: o.x + o.w / 2, y: S.wall.y + L.blockH / 2, w: o.w - 3, h: L.blockH, pts: o.pts || rockPts(o.w - 3, L.blockH, o.seed), seed: o.seed,
        text: o.text, k: o.k, vx: rnd(-50, 50), vy: rnd(120, 220), rot: 0, vr: rnd(-3, 3), harmless: true });
    }
    S.stats.correct++;
    const speed0 = Math.round(SCORING.speedMax * Math.max(0, 1 - S.fallT / SCORING.speedTime));
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    S.mult = Math.min(SCORING.multMax, 1 + Math.floor(S.streak / 2) * SCORING.multStep);
    addScore(Math.round((SCORING.correct + speed0) * M()), bl.x + bl.w / 2, S.wall.y + L.blockH / 2);
    const ms = UPGRADE_AT.find((m) => S.streak >= m && !S.got.includes(m));
    if (ms != null) { S.got.push(ms); S.picks.push(`Chuỗi ${S.streak} câu đúng`); }
    if (isGift()) S.picks.push("Câu thưởng");
    if (S.picks.length) setTimeout(() => offerUpgrade(), 450);
    else if (S.streak >= 2) S.banner = { title: `Chuỗi ${S.streak}!`, sub: `Điểm ×${S.mult}`, t: 1.4 };
    // Đúng: cục đá vỡ vụn tại chỗ
    const bx = bl.x + bl.w / 2, by = S.wall.y + L.blockH / 2;
    for (let i = 0; i < (reduceMotion ? 8 : 26); i++) S.parts.push({ x: bx + rnd(-30, 30), y: by + rnd(-30, 30), vx: rnd(-220, 220), vy: rnd(-260, 60), life: rnd(0.5, 1), max: 1, color: ["#C08A4A", "#8E5C2C", "#E0B070"][i % 3], r: rnd(3, 8), chunk: true });
    burst(bx, by, "#6EE7A8", 18, 220);
    addText(bx, by - 26, "Đúng!", "#6EE7A8", 22, 1);
    S.phase = "attack"; S.attackT = CONFIG.attackTime; S.segDone = 0;
    sfx("good");
  } else {
    // Sai: cục đá rơi xuống đè nhân vật
    bl.state = "fallen";
    S.stats.wrong++; breakStreak();
    S.falling.push({ x: bl.x + bl.w / 2, y: S.wall.y + L.blockH / 2, w: bl.w - 3, h: L.blockH, pts: bl.pts || rockPts(bl.w - 3, L.blockH, bl.seed), seed: bl.seed,
      text: bl.text, k: bl.k, vx: 0, vy: 40, rot: 0, vr: rnd(-1.5, 1.5) });
    burst(bl.x + bl.w / 2, S.wall.y + L.blockH / 2, "#C08A4A", 14, 160);
    addText(bl.x + bl.w / 2, S.wall.y + L.blockH + 18, "Sai", "#FF8A7E", 18);
    S.shake = 6; sfx("bad");
  }
  sendStatus(true);
}

/* Trả lời sai: địch bắn 1 quả bóng đỏ vào nhân vật, trúng là mất 1 mạng */
/* Bom rơi ra từ khoang bom (ox = 0) hoặc giá treo dưới cánh (ox ≠ 0) của máy bay thứ pi */
function mouthPos(pi, ox) {
  const ps = S.boss.planes || [{ x: W / 2, s: 1 }], P = ps[(pi || 0) % ps.length]; ox = ox || 0;
  return { x: P.x + ox * P.s, y: planeNoseY(P) - (ox ? 64 : 30) * P.s };
}
function bossShoot() {
  const pi = Math.floor(Math.random() * ((S.boss.planes || []).length || 1)), m = mouthPos(pi, 0);
  S.eshots.push({ x: m.x, y: m.y, pi, ox: 0, hp: 1, delay: 0.3, speed: CONFIG.enemyShotSpeed, vx: 0, vy: CONFIG.enemyShotSpeed });
  S.boss.angry = 0.6; S.boss.mouth = 0.7; sfx("drop");
}
/* Boss phản công: ném bóng đỏ chậm qua hàng đá, bắn chặn được */
function throwGap() {
  const k = S.N > 1 ? S.qi / (S.N - 1) : 0;
  const q = S.qi + 1, n = q >= CONFIG.fireball3From ? 3 : q >= CONFIG.fireball2From ? 2 : 1;
  // phun nhiều quả một lần thì giãn khoảng cách giữa các lần phun
  return (CONFIG.bossThrowFrom + (CONFIG.bossThrowTo - CONFIG.bossThrowFrom) * k) * (1 + 0.6 * (n - 1)) * (S.lastQ ? 0.8 : 1);
}
function bossThrow() {
  const m = mouthPos(), q = S.qi + 1;
  const n = q >= CONFIG.fireball3From ? 3 : q >= CONFIG.fireball2From ? 2 : 1;
  const sp = CONFIG.bossThrowSpeed * (S.lastQ ? 1.2 : 1);
  const spread = n === 1 ? [rnd(-0.35, 0.35)] : n === 2 ? [-0.38, 0.38] : [-0.55, 0, 0.55];
  const np = (S.boss.planes || []).length || 1, st = Math.floor(Math.random() * np), used = {};
  spread.forEach((off, i) => {
    const pi = (st + i) % np, u = used[pi] = (used[pi] || 0) + 1;
    const ox = u === 1 ? 0 : (u % 2 ? -26 : 26), a = Math.PI / 2 + (np > 1 || ox ? off * 0.35 : off);
    const p0 = mouthPos(pi, ox);
    S.eshots.push({ x: p0.x, y: p0.y, pi, ox, delay: 0.35 + i * 0.12, speed: sp, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
  });
  S.boss.angry = 0.6; S.boss.mouth = 0.7 + n * 0.12; sfx("drop");
}
function M() { return S.mult * (S.lastQ ? CONFIG.finalMult : 1); }
function updateShots(dt) {
  for (const e of S.eshots) {
    if (e.blocked) continue;
    e.flash = Math.max(0, (e.flash || 0) - dt * 6);
    if (e.delay > 0) { e.delay -= dt; const m = mouthPos(e.pi, e.ox); e.x = m.x; e.y = m.y; continue; }
    const dx = W / 2 - e.x, dy = L.py - e.y, d = Math.hypot(dx, dy);
    const sp = e.speed * dt;
    if (d <= sp + L.pr + CONFIG.fireballR * 0.6) { e.hit = true; continue; }
    // bay theo hướng phun rồi lượn dần về phía nhân vật
    const k = Math.min(1, dt * 0.8);
    e.vx += (dx / d * e.speed - e.vx) * k; e.vy += (dy / d * e.speed - e.vy) * k;
    const vl = Math.hypot(e.vx, e.vy) || 1; e.vx = e.vx / vl * e.speed; e.vy = e.vy / vl * e.speed;
    e.x = clamp(e.x + e.vx * dt, CONFIG.fireballR, W - CONFIG.fireballR); e.y += e.vy * dt;
    // vệt khói sau đuôi bom
    const R = CONFIG.fireballR, ux = e.vx / e.speed, uy = e.vy / e.speed;
    if (!reduceMotion || Math.random() < 0.4) S.parts.push({ x: e.x - ux * R * 1.4 + rnd(-3, 3), y: e.y - uy * R * 1.4 + rnd(-3, 3), vx: -ux * rnd(20, 50) + rnd(-12, 12), vy: -uy * rnd(20, 50) + rnd(-12, 12), life: rnd(0.35, 0.6), max: 0.6, color: Math.random() < 0.5 ? "#8A8A96" : "#6A6A78", r: rnd(R * 0.2, R * 0.32), smoke: true });
    e.ux = ux; e.uy = uy;
  }
  for (const e of S.eshots.filter((e) => e.hit)) { explode(W / 2, L.py - 8, 1.2); sfx("boom"); hurt("#FF3B30"); }
  S.eshots = S.eshots.filter((e) => !e.hit && !e.blocked);
  // đá sai rơi xuống, lượn về phía nhân vật
  for (const f of S.falling) {
    f.vy += 900 * dt; f.rot += f.vr * dt;
    if (f.harmless) { f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.y - f.h > H) f.hit = true; continue; }
    f.vx += ((W / 2 - f.x) * 6 - f.vx) * Math.min(1, dt * 4);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.y + f.h * 0.35 >= L.py - L.pr) { f.hit = true; for (let i = 0; i < 18; i++) S.parts.push({ x: f.x + rnd(-25, 25), y: L.py - 20 + rnd(-15, 15), vx: rnd(-260, 260), vy: rnd(-280, -40), life: rnd(0.5, 0.9), max: 0.9, color: ["#9C8A72", "#6E5E4B"][i % 2], r: rnd(3, 7) }); hurt("#FF6B5E"); }
  }
  S.falling = S.falling.filter((f) => !f.hit);
}
function hurt(color) {
  if (S.hearts <= 0) return;
  if (S.shield > 0) { S.shield--; burst(W / 2, L.py, "#8FD3FF", 26, 240); addText(W / 2, L.py - 50, "Khiên đỡ!", "#8FD3FF", 20); sfx("stone"); return; }
  S.hearts--; S.shake = 16; S.flash = 0.6; sfx("crash");
  burst(W / 2, L.py, color, 30, 280);
  addText(W / 2, L.py - 50, "−1 ♥", "#FF8A7E", 26);
  if (S.hearts <= 0 && S.phase !== "over" && S.phase !== "dying") { S.phase = "over"; S.phaseT = 0; }
  sendStatus(true);
}

function breakStreak() {
  if (S.streak >= 2) addText(W / 2, L.py - 80, "Mất chuỗi", "#C4E2C6", 16);
  S.streak = 0; S.mult = 1;
}

function hitBoss(x, y) {
  const floor = bossFloor();
  if (S.phase !== "attack") { sfx("stone"); return; }
  if (S.boss.hp <= floor) {
    // đã phá giáp: máu không giảm thêm nhưng mỗi phát trúng vẫn được điểm
    const pts = Math.round(SCORING.damage * 0.5 * S.power * M()); S.score += pts; S.stats.hits++;
    burst(x, y, "#FFE29A", 4, 120); sfx("boss");
    return;
  }
  const dmg = Math.min(S.power, S.boss.hp - floor);
  S.boss.hp -= dmg; S.boss.flash = 1; S.boss.hurt = 0.25; S.stats.hits++;
  addScore(Math.round(SCORING.damage * dmg * M()));
  burst(x, y, S.power > 1 ? "#FF9A3C" : "#FFD27A", 5, 140);
  if (S.power > 1) { const pi = nearestPlane(x); S.boss.burn = CONFIG.burnTime; S.boss.burnPi = pi; S.boss.burnDx = x - S.boss.planes[pi].x; S.boss.burnY = y - planeNoseY(S.boss.planes[pi]); }
  sfx("boss");
  if (S.boss.hp <= floor) hitBossDone();
}
function hitBossDone() {
  if (S.phase !== "attack") return;
  S.shake = 8;
  if (S.boss.hp <= 0) { S.phase = "dying"; S.phaseT = 0; S.balls = []; sfx("win"); }
  else S.attackT = Math.min(S.attackT, CONFIG.afterBreak);
}

function addScore(n, x, y) { S.score += n; if (x != null) addText(x, y, `+${n}`, "#FFE29A", 20); }
function addText(x, y, text, color, size, life) { S.texts.push({ x, y, text, color, size, life: life || 1.1, max: life || 1.1 }); }
function burst(x, y, color, n, sp) {
  if (reduceMotion) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), v = rnd(sp * 0.3, sp); S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.3, 0.7), max: 0.7, color, r: rnd(1.5, 3.5) }); }
}

/* Vụ nổ bom: chớp lửa, tia lửa, khói tỏa */
function explode(x, y, k) {
  const n = reduceMotion ? 6 : 16;
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), v = rnd(40, 220) * k; S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.25, 0.5), max: 0.5, color: ["#FFF3C4", "#FFD27A", "#FF9A3C", "#FF5A1F"][i % 4], r: rnd(4, 9) * k, flame: true }); }
  for (let i = 0; i < n / 2; i++) { const a = rnd(0, Math.PI * 2), v = rnd(20, 70) * k; S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: rnd(0.5, 0.9), max: 0.9, color: i % 2 ? "#55525E" : "#3E3B46", r: rnd(6, 11) * k, smoke: true }); }
  burst(x, y, "#FFE29A", 10, 300 * k);
}

/* Viện trợ: dừng game, hiện 3 thẻ (tốc độ bắn, hồi máu, 1 thẻ ngẫu nhiên) */
function isGift() { return UPGRADE_QUESTIONS.includes(S.qi + 1); }
function offerUpgrade() {
  if (!S || S.over || !S.picks.length || !$("pickScr").hidden) return;
  const ok = (id) => { const u = UPGRADES.find((x) => x.id === id); return u && (S.owned[id] || 0) < u.max ? u : null; };
  const first = ok("fast") || ok("multi"), heal = ok("heart");
  const rest = shuffle(UPGRADES.filter((u) => u !== first && u !== heal && (S.owned[u.id] || 0) < u.max));
  const pool = [first, heal, ...rest].filter(Boolean).slice(0, 3);
  const why = S.picks.shift();
  if (!pool.length) return;
  paused = true; release();
  $("pickEyebrow").textContent = why;
  $("picks").innerHTML = pool.map((u, i) => `<button class="pick" data-i="${i}"><b>${u.name}</b><span>${u.desc}</span></button>`).join("");
  $("picks").querySelectorAll(".pick").forEach((btn) => btn.onclick = () => {
    const u = pool[Number(btn.dataset.i)];
    u.apply(S); S.owned[u.id] = (S.owned[u.id] || 0) + 1;
    $("pickScr").hidden = true; paused = false;
    S.banner = { title: u.name, sub: u.desc, t: 1.4 }; sfx("good");
    if (S.picks.length) setTimeout(() => offerUpgrade(), 300);
  });
  $("pickScr").hidden = false;
}

/* ---------------- Cập nhật ---------------- */
function update(dt) {
  S.time += dt; S.phaseT += dt;
  const B = S.boss;
  B.y += (B.ty - B.y) * Math.min(1, dt * 7);
  updatePlanes(dt);
  B.flash = Math.max(0, B.flash - dt * 6); B.hurt = Math.max(0, B.hurt - dt); B.roar = Math.max(0, (B.roar || 0) - dt);
  // Cháy: đạn lửa trúng địch thì địch bị đốt, mất thêm máu mỗi 0.4 giây
  if (B.burn > 0) {
    B.burn -= dt; B.burnTick = (B.burnTick || 0) - dt;
    if (!reduceMotion || Math.random() < 0.3) for (let i = 0; i < 2; i++) S.parts.push({ x: rnd(burnPos().x - 8, burnPos().x + 8), y: burnPos().y - rnd(0, 6), vx: rnd(-15, 15), vy: rnd(-50, -20), life: rnd(0.25, 0.45), max: 0.45, color: ["#FF9A3C", "#FFD27A", "#FF5A1F"][i % 3], r: rnd(3, 6), flame: true });
    if (B.burnTick <= 0) {
      B.burnTick = CONFIG.burnTick;
      const floor = bossFloor();
      if (S.phase === "attack" && B.hp > floor) {
        B.hp -= 1; B.hurt = 0.15; S.score += Math.round(SCORING.damage * M());
        if (B.hp <= floor) hitBossDone();
      }
    }
  }
  S.shake = Math.max(0, S.shake - dt * 40); S.flash = Math.max(0, S.flash - dt * 1.5);
  S.shownScore += (S.score - S.shownScore) * Math.min(1, dt * 8);

  const w = S.wall;
  if (S.phase === "intro") {
    const k = Math.min(1, S.phaseT / 0.3);
    w.from = B.y + L.bossH - L.blockH; w.to = S.boss.ty + L.bossH + L.gap;
    w.y = w.from + (w.to - w.from) * (1 - Math.pow(1 - k, 3));
    if (k >= 1 && Math.abs(B.y - B.ty) < 5) { B.y = B.ty; S.phase = "fall"; S.phaseT = 0; }
  } else if (S.phase === "fall") {
    S.fallT += dt; w.y += CONFIG.wallSpeed * (S.lastQ ? CONFIG.finalSpeed : 1) * dt;
    if (S.fallT > Math.max(1, CONFIG.shieldTime)) { S.throwT -= dt; if (S.throwT <= 0) { bossThrow(); S.throwT = throwGap(); } }
    if (w.y + L.blockH >= L.danger) crash();
  } else if (S.phase === "attack") {
    S.attackT -= dt;
    S.throwT -= dt; if (S.throwT <= 0) { bossThrow(); S.throwT = throwGap() * 1.6; } // lúc tấn công boss ném thưa hơn
    if (S.attackT <= 0) toNext();
  } else if (S.phase === "reveal") {
    if (S.phaseT > 0.9 && !S.falling.length) toNext();
  } else if (S.phase === "next") {
    if (w) w.alpha = Math.max(0, 1 - S.phaseT / 0.35);
    if (S.phaseT > 0.3 && !S.falling.length) {
      if (S.qi + 1 >= S.N) finish();
      else if (laneWidth(S.qi + 1) !== W) startWiden();
      else startQuestion(S.qi + 1);
    }
  } else if (S.phase === "widen") {
    // làn đường mở rộng: camera lùi ra, cánh B-52 vẫn trải kín làn
    const k = Math.min(1, Math.max(0, (S.phaseT - 0.35) / 1.1)), e = k * k * (3 - 2 * k);
    const nw = S.W0 + (S.W1 - S.W0) * e, dx = (nw - W) / 2;
    if (dx) { for (const p of S.parts) p.x += dx; for (const t of S.texts) t.x += dx; for (const e2 of S.eshots) e2.x += dx; for (const P of S.boss.planes || []) P.x += dx; S.aim.x += dx; W = nw; }
    S.boss.mouth = Math.max(S.boss.mouth, 0.4); S.boss.angry = 0.5; S.shake = Math.max(S.shake, 4);
    if (S.phaseT > 1.5) { W = S.W1; startQuestion(S.qi + 1); }
  } else if (S.phase === "over") {
    if (S.phaseT > 1.2) finish();
  } else if (S.phase === "dying") {
    if (Math.random() < 0.6) burst(rnd(20, W - 20), B.y + rnd(10, L.bossH - 10), Math.random() < 0.5 ? "#FFD27A" : "#FF6B5E", 6, 220);
    S.shake = 6;
    if (S.phaseT > 1.8) finish();
  }
  for (const bl of (w ? w.blocks : [])) bl.flash = Math.max(0, bl.flash - dt * 7);

  // Bắn
  updateShots(dt);
  S.boss.angry = Math.max(0, (S.boss.angry || 0) - dt); S.boss.mouth = Math.max(0, (S.boss.mouth || 0) - dt);
  const canFire = S.armed && S.phase !== "over" && S.phase !== "dying";
  if (canFire) {
    S.fireCd -= dt;
    while (S.fireCd <= 0) { fire(); S.fireCd += 1 / S.fireRate; }
  } else S.fireCd = Math.max(0, S.fireCd - dt);

  // Đạn lửa để lại vệt lửa
  for (const b of S.balls) if (b.fire && Math.random() < 0.6) S.parts.push({ x: b.x + rnd(-3, 3), y: b.y + rnd(-3, 3), vx: -b.vx * 0.05, vy: -b.vy * 0.05 - 30, life: rnd(0.2, 0.4), max: 0.4, color: Math.random() < 0.5 ? "#FF9A3C" : "#FF5A1F", r: rnd(2, 4.5), flame: true });
  // Đạn
  const steps = Math.max(1, Math.ceil(CONFIG.ballSpeed * dt / 4));
  const h = dt / steps;
  for (let s = 0; s < steps; s++) for (const b of S.balls) stepBall(b, h);
  const before = S.balls.length;
  S.balls = S.balls.filter((b) => b.y < H + 20);

  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (p.chunk) { p.vy += 1100 * dt; } else if (p.flame) { p.vx *= 0.95; p.r *= 0.985; } else if (p.smoke) { p.vx *= 0.95; p.vy *= 0.95; p.r *= 1.025; } else { p.vx *= 0.92; p.vy = p.vy * 0.92 + 300 * dt; } p.life -= dt; }
  S.parts = S.parts.filter((p) => p.life > 0);
  for (const t of S.texts) { t.y -= 30 * dt; t.life -= dt; }
  S.texts = S.texts.filter((t) => t.life > 0);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
}

function aimDir() {
  let dx = S.aim.x - W / 2, dy = S.aim.y - L.py;
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const minUp = 0.2;
  if (dy > -minUp) { dy = -minUp; dx = Math.sign(dx || 1) * Math.sqrt(1 - minUp * minUp); }
  return { x: dx, y: dy };
}
function fire() {
  const d = aimDir(), sp = CONFIG.ballSpeed, base = Math.atan2(d.y, d.x);
  // đạn đôi/ba bay song song, cách nhau 13px, để vẫn trúng đúng cục đá đang ngắm
  for (let i = 0; i < S.shots; i++) {
    const off = (i - (S.shots - 1) / 2) * 13, a = base;
    S.balls.push({ x: W / 2 + Math.cos(a) * (L.pr + 8) - d.y * off, y: L.py + Math.sin(a) * (L.pr + 8) + d.x * off, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, fire: S.power > 1, r: S.ballR });
  }
  sfx("fire");
}

function stepBall(b, h) {
  b.x += b.vx * h; b.y += b.vy * h;
  const r = b.r || L.br;
  for (const e of S.eshots) {
    if (e.blocked || e.delay > 0) continue;
    const dx = b.x - e.x, dy = b.y - e.y;
    if (dx * dx + dy * dy < (r + CONFIG.fireballR) * (r + CONFIG.fireballR)) {
      // bóng nảy ra khỏi quả bom; trúng đủ CONFIG.bombHp lần thì bom mới nổ
      const d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d, dot = b.vx * nx + b.vy * ny;
      if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
      b.x = e.x + nx * (r + CONFIG.fireballR + 0.5); b.y = e.y + ny * (r + CONFIG.fireballR + 0.5); fixAngle(b);
      e.hp = (e.hp == null ? CONFIG.bombHp : e.hp) - 1; e.flash = 1;
      if (e.hp > 0) { burst(b.x, b.y, "#FFE29A", 6, 150); sfx("clink"); continue; }
      e.blocked = true; S.stats.blocks = (S.stats.blocks || 0) + 1;
      const pts = Math.round(SCORING.blockShot * M()); S.score += pts;
      explode(e.x, e.y, 1); addText(e.x, e.y - 14, `Chặn! +${pts}`, "#FFB3AD", 16); sfx("boom");
    }
  }
  if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx); bounce(b); }
  if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx); bounce(b); }
  const top = ceilY(); // trần: mép dưới khung câu hỏi, chạm vào chỉ nảy lại
  if (b.y - r < top && b.vy < 0) { b.y = top + r; b.vy = Math.abs(b.vy); bounce(b); }
  const hp = hitPlane(b, r);
  if (hp) hitBoss(hp.x, hp.y);
  const w = S.wall;
  if (!w || S.phase === "next" || S.phase === "reveal" || w.alpha < 1) return;
  for (const bl of w.blocks) {
    if (bl.state === "gone" || bl.state === "fallen") continue;
    const rx = bl.x, ry = w.y, rw = bl.w, rh = L.blockH;
    const cx = clamp(b.x, rx, rx + rw), cy = clamp(b.y, ry, ry + rh);
    let dx = b.x - cx, dy = b.y - cy; const d2 = dx * dx + dy * dy;
    if (d2 > r * r) continue;
    let nx, ny;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; b.x = cx + nx * r; b.y = cy + ny * r; }
    else {
      const pen = [[b.x - rx, -1, 0], [rx + rw - b.x, 1, 0], [b.y - ry, 0, -1], [ry + rh - b.y, 0, 1]].sort((p, q) => p[0] - q[0])[0];
      nx = pen[1]; ny = pen[2];
      if (nx) b.x = nx < 0 ? rx - r : rx + rw + r; else b.y = ny < 0 ? ry - r : ry + rh + r;
    }
    const dot = b.vx * nx + b.vy * ny;
    if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
    bounce(b);
    // đá mới hiện ra được miễn sát thương một chút, để đạn còn bay từ câu trước không bắn vỡ nhầm
    if (bl.state === "live" && (S.phase === "intro" || (S.phase === "fall" && S.fallT >= CONFIG.shieldTime))) {
      bl.hp -= S.power; bl.flash = 1; sfx("hit", CONFIG.blockHp - bl.hp);
      burst(b.x, b.y, "#BFD3FF", 3, 120);
      if (bl.hp <= 0) breakBlock(bl);
    } else sfx("stone");
    break;
  }
}
/* Nảy hơi ngẫu nhiên: lệch góc một chút mỗi lần chạm */
function bounce(b) {
  const j = rnd(-CONFIG.bounceJitter, CONFIG.bounceJitter), c = Math.cos(j), sn = Math.sin(j);
  const vx = b.vx * c - b.vy * sn, vy = b.vx * sn + b.vy * c;
  b.vx = vx; b.vy = vy; fixAngle(b);
}
function fixAngle(b) {
  const sp = CONFIG.ballSpeed, minVy = sp * 0.22;
  if (Math.abs(b.vy) < minVy) {
    b.vy = (b.vy >= 0 ? 1 : -1) * minVy;
    b.vx = Math.sign(b.vx || 1) * Math.sqrt(sp * sp - minVy * minVy);
  }
}

/* ---------------- Vẽ ---------------- */
function draw() {
  view();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createRadialGradient(VW / 2, 0, 0, VW / 2, 0, Math.max(VW, VH));
  g.addColorStop(0, "#3F8A4E"); g.addColorStop(0.5, "#265C33"); g.addColorStop(1, "#143A20");
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  if (S && S.shake > 0 && !reduceMotion) { sx = rnd(-1, 1) * S.shake * 0.5; sy = rnd(-1, 1) * S.shake * 0.5; }
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * (OX + sx * SC), DPR * (OY + sy * SC));

  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (!S) { drawPlayer({ x: 0, y: -1 }); ctx.restore(); return; }

  drawDanger();
  drawWall();
  drawBoss();
  drawAim();
  for (const b of S.balls) {
    ctx.fillStyle = "rgba(226, 174, 69, 0.25)";
    const br = b.r || L.br;
    ctx.beginPath(); ctx.arc(b.x - b.vx * 0.012, b.y - b.vy * 0.012, br * 0.9, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = b.fire ? "#8A2A0A" : "#7A5A12"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 2, 0, Math.PI * 2); ctx.fill();
  }
  drawPlayer(aimDir());
  for (const e of S.eshots) {
    if (e.blocked) continue;
    drawBomb(e);
  }
  if (!S.armed && FIRE_PHASES.includes(S.phase)) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.time * 5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `800 18px ${FONT}`; ctx.fillStyle = "#F3EBD8";
    ctx.fillText("Kéo để ngắm", W / 2, L.py - 70);
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const t of S.texts) {

    ctx.font = `800 ${t.size}px ${FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(10,18,54,0.9)";
    ctx.strokeText(t.text, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  drawHud();
  if (S.flash > 0) { ctx.fillStyle = `rgba(200, 53, 44, ${S.flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

    ctx.fillStyle = "#8E120C"; ctx.font = `800 ${f.size}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (w && w.blocks.some((bl) => bl.state !== "gone" && x + r > bl.x && x - r < bl.x + bl.w && y - r < w.y + L.blockH && y + r > w.y)) break;
    if (i % 4 === 0) { ctx.globalAlpha = 0.85 * (1 - dist / 560); ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "rgba(20, 40, 30, 0.7)"; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}

/* Bom của B-52: thân xanh ô liu, vạch vàng ở mũi, cánh đuôi chữ thập, quầng đỏ nhấp nháy báo nguy hiểm */
function drawBomb(e) {
  const R0 = CONFIG.fireballR * 0.8, R = e.delay > 0 ? R0 * Math.max(0.3, 1 - e.delay / 0.45) : R0;
  const ang = Math.atan2(e.uy == null ? 1 : e.uy, e.ux || 0), pul = 0.5 + 0.5 * Math.sin(S.time * 14 + e.x * 0.1);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; if (e.delay > 0) ctx.globalAlpha = 0;
  const glow = ctx.createRadialGradient(e.x, e.y, R * 0.4, e.x, e.y, R * 2);
  glow.addColorStop(0, `rgba(255, 70, 40, ${0.3 + 0.25 * pul})`); glow.addColorStop(1, "rgba(255, 40, 20, 0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(e.x, e.y, R * 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(ang - Math.PI / 2); // trục +y = hướng bay
  const L1 = R * 1.35, wd = R * 0.62;
  ctx.fillStyle = "#2E3524"; ctx.strokeStyle = "#12160E"; ctx.lineWidth = 1.5;
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * wd * 0.45, -L1 * 0.5); ctx.lineTo(sd * wd * 1.3, -L1 * 1.08); ctx.lineTo(sd * wd * 0.15, -L1 * 0.98); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.fillRect(-wd * 0.85, -L1 * 1.12, wd * 1.7, R * 0.2); ctx.strokeRect(-wd * 0.85, -L1 * 1.12, wd * 1.7, R * 0.2);
  const body = () => { ctx.beginPath(); ctx.moveTo(-wd * 0.42, -L1 * 0.92); ctx.quadraticCurveTo(-wd * 1.05, -L1 * 0.4, -wd, L1 * 0.25); ctx.quadraticCurveTo(-wd * 0.95, L1, 0, L1); ctx.quadraticCurveTo(wd * 0.95, L1, wd, L1 * 0.25); ctx.quadraticCurveTo(wd * 1.05, -L1 * 0.4, wd * 0.42, -L1 * 0.92); ctx.closePath(); };
  const gb = ctx.createLinearGradient(-wd, 0, wd, 0);
  gb.addColorStop(0, "#2C3520"); gb.addColorStop(0.4, "#6E7D50"); gb.addColorStop(1, "#2C3520");
  body(); ctx.fillStyle = gb; ctx.fill();
  ctx.save(); body(); ctx.clip(); ctx.fillStyle = "#E2B23A"; ctx.fillRect(-wd, L1 * 0.38, wd * 2, R * 0.18); ctx.restore();
  body(); ctx.stroke();
  ctx.fillStyle = "rgba(255, 255, 255, 0.25)"; ctx.beginPath(); ctx.ellipse(-wd * 0.4, -L1 * 0.05, wd * 0.16, L1 * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  if (e.flash > 0) { body(); ctx.fillStyle = `rgba(255, 255, 255, ${e.flash * 0.7})`; ctx.fill(); }
  ctx.restore();
  // số phát còn lại để chặn
  const hp = e.hp == null ? CONFIG.bombHp : e.hp;
  if (e.delay <= 0 && CONFIG.bombHp > 1) for (let i = 0; i < CONFIG.bombHp; i++) {
    const px = e.x + (i - (CONFIG.bombHp - 1) / 2) * 9, py = e.y - R * 1.75;
    ctx.fillStyle = i < hp ? "#FF5A4E" : "rgba(30, 30, 30, 0.5)"; ctx.strokeStyle = "#2A0A08"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(px, py, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function drawPlayer(d) {
  const x = W / 2, y = L.py;
  if (S && S.shield > 0) {
    ctx.strokeStyle = `rgba(143, 211, 255, ${0.55 + 0.25 * Math.sin(S.time * 4)})`; ctx.lineWidth = 3;
    for (let i = 0; i < S.shield; i++) { ctx.beginPath(); ctx.arc(x, y, L.pr + 10 + i * 6, 0, Math.PI * 2); ctx.stroke(); }
  }
  // bệ
  ctx.fillStyle = "#285A35"; rr(x - 46, y + 14, 92, 18, 4); ctx.fill();
  ctx.strokeStyle = "#5E9E66"; ctx.lineWidth = 2; ctx.stroke();
  // nòng
  const a = Math.atan2(d.y, d.x);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = "#3A4A2C"; rr(4, -7, 34, 14, 3); ctx.fill();
  ctx.fillStyle = "#E2AE45"; ctx.fillRect(32, -8, 6, 16);
  ctx.restore();
  // thân
  ctx.fillStyle = "#E2AE45"; ctx.beginPath(); ctx.arc(x, y, L.pr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#9C7322"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#C8352C"; ctx.beginPath(); ctx.arc(x, y - 2, 11, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#FFE29A";
  ctx.beginPath();
  for (let i = 0; i < 5; i++) { const t = -Math.PI / 2 + i * 4 * Math.PI / 5; ctx.lineTo(x + Math.cos(t) * 5, y - 7 + Math.sin(t) * 5); }
  ctx.fill();
  ctx.fillStyle = "#0A1236"; ctx.beginPath(); ctx.arc(x - 6, y + 5, 2.2, 0, Math.PI * 2); ctx.arc(x + 6, y + 5, 2.2, 0, Math.PI * 2); ctx.fill();
  if (!S) return;
}

function heart(x, y, s, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.75, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.75, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  ctx.fill();
}
function drawHud() {
  const nh = Math.max(S.maxHearts, S.hearts);
  for (let i = 0; i < nh; i++) heart(16 + i * 22, 12, 18, i < S.hearts ? "#FF5A4E" : "rgba(255,255,255,0.15)");
  ctx.textBaseline = "middle";
  ctx.textAlign = "center"; ctx.fillStyle = "#FFE29A"; ctx.font = `900 26px ${DFONT}`;
  const sc = Math.round(S.shownScore).toLocaleString("vi-VN"), sw = ctx.measureText(sc).width;
  const sx = Math.max(W / 2, 16 + nh * 22 + 10 + sw / 2); // không đè lên hàng tim
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(20, 30, 20, 0.8)"; ctx.strokeText(sc, sx, 22); ctx.fillText(sc, sx, 22);
  if (M() > 1) {
    const x = sx + sw / 2 + 8;
    ctx.font = `800 12px ${FONT}`; const t = `×${M()}`, tw = ctx.measureText(t).width + 10;
    ctx.fillStyle = "#FF9A3C"; rr(x, 13, tw, 18, 4); ctx.fill();
    ctx.fillStyle = "#1B0E04"; ctx.textAlign = "left"; ctx.fillText(t, x + 5, 22.5);
  }
  if (S.banner) {
    const b = S.banner, a = Math.min(1, b.t * 3), y = L.danger - 70;
    ctx.globalAlpha = a; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(8, 30, 14, 0.82)"; rr(W / 2 - 120, y - 32, 240, 64, 6); ctx.fill();
    ctx.strokeStyle = "#E2AE45"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#FFE29A"; ctx.font = `900 26px ${DFONT}`; ctx.fillText(b.title, W / 2, y - 9);
    ctx.fillStyle = "#F3EBD8"; ctx.font = `800 15px ${FONT}`; ctx.fillText(b.sub, W / 2, y + 16);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- Điều khiển ---------------- */
function toLogical(e) { return { x: (e.clientX - OX) / SC, y: (e.clientY - OY) / SC }; }
cv.addEventListener("pointerdown", (e) => {
  initAudio(); if (AC && AC.state === "suspended") AC.resume();
  if (!S || S.over || paused) return;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  S.aim = toLogical(e); S.holding = true; S.aimShow = true; S.armed = true;
});
cv.addEventListener("pointermove", (e) => {
  if (!S || S.over) return;
  if (e.pointerType === "mouse" || S.holding) { S.aim = toLogical(e); S.aimShow = true; S.armed = true; }
});
const release = () => { if (S) { S.holding = false; } };
cv.addEventListener("pointerup", (e) => { release(); if (S && e.pointerType !== "mouse") S.aimShow = false; });
cv.addEventListener("pointercancel", release);
addEventListener("blur", release);
addEventListener("keydown", (e) => {
  if (!S || S.over || paused || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { S.armed = true; e.preventDefault(); }
  if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
    const d = aimDir(); const a = Math.atan2(d.y, d.x) + (e.code === "ArrowLeft" ? -0.06 : 0.06);
    S.aim = { x: W / 2 + Math.cos(a) * 300, y: L.py + Math.sin(a) * 300 }; S.aimShow = true; S.armed = true;
  }
});
addEventListener("keyup", (e) => { if (S && e.code === "Space") S.holding = false; });

$("muteBtn").onclick = () => { muted = !muted; $("muteBtn").style.opacity = muted ? 0.4 : 1; };
$("leaveBtn").onclick = () => { paused = true; release(); $("leaveScr").hidden = false; };
$("stayBtn").onclick = () => { paused = false; $("leaveScr").hidden = true; };
$("quitBtn").onclick = () => {
  $("leaveScr").hidden = true; paused = false;
  if (S && !S.over) { S.over = true; S.result = "lose"; S.left = true; sendStatus(true); }
  S = null; $("top").hidden = true; showStart();
};
$("playBtn").onclick = () => { initAudio(); startGame(); };
$("nameInp").addEventListener("keydown", (e) => { if (e.key === "Enter") $("playBtn").click(); });
$("againBtn").onclick = () => { startGame(); };

/* ---------------- Kết thúc ---------------- */
function finish() {
  if (S.over) return;
  const win = S.boss.hp <= 0;
  S.over = true; S.result = win ? "win" : "lose"; S.balls = []; S.holding = false;
  S.endBonus = (win ? SCORING.bossKill : 0) + Math.max(0, S.hearts) * SCORING.heartLeft + (S.stats.correct === S.N && S.stats.wrong === 0 ? SCORING.perfect : 0);
  S.score += S.endBonus; S.shownScore = S.score;
  S.elapsed = Math.round((performance.now() - S.t0) / 1000);
  const best = readBest(), isBest = S.score > best;
  if (isBest) try { localStorage.setItem("banBongBest", String(S.score)); } catch (e) {}
  const pct = Math.round(100 * Math.max(0, S.boss.hp) / S.boss.max);
  $("endEyebrow").textContent = win ? "Đã hạ kẻ địch" : S.hearts <= 0 ? "Hết mạng" : `Kẻ địch còn ${pct}% máu`;
  $("endTitle").textContent = win ? "Chiến thắng!" : S.hearts <= 0 ? "Thất bại" : "Hết câu hỏi";
  $("endScore").textContent = S.score.toLocaleString("vi-VN");
  $("endStats").innerHTML = `<span class="stat">Đúng <b>${S.stats.correct}/${S.N}</b></span><span class="stat">Chuỗi dài nhất <b>${S.bestStreak}</b></span><span class="stat">Chặn <b>${S.stats.blocks || 0}</b></span><span class="stat">Thời gian <b>${Math.floor(S.elapsed / 60)}:${String(S.elapsed % 60).padStart(2, "0")}</b></span>`;
  $("endBest").textContent = isBest ? "Kỷ lục mới của bạn" : `Kỷ lục: ${best.toLocaleString("vi-VN")}`;
  $("top").hidden = true;
  setTimeout(() => { $("endScr").hidden = false; }, 250);
  sendStatus(true);
}
function readBest() { try { return Number(localStorage.getItem("banBongBest")) || 0; } catch (e) { return 0; } }
function showStart() {
  $("startScr").hidden = false; $("endScr").hidden = true;
  const b = readBest(); $("bestTxt").textContent = b ? `Kỷ lục: ${b.toLocaleString("vi-VN")}` : "";
}
try { $("nameInp").value = localStorage.getItem("banBongName") || ""; } catch (e) {}
showStart();

/* ---------------- Gửi trạng thái cho màn admin ----------------
   Chỉ hoạt động khi game chạy bằng server đi kèm hoặc trên Vercel. */
const SERVER_MODE = location.protocol.startsWith("http") && !/claude|anthropic/.test(location.hostname);
const PLAYER_ID = (() => {
  try {
    let id = localStorage.getItem("banBongId");
    if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem("banBongId", id); }
    return id;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
})();
let lastSent = 0, sendTimer = null, lastS = null;
function statusPayload(st) {
  const pct = Math.round(100 * Math.max(0, st.boss.hp) / st.boss.max);
  return {
    id: PLAYER_ID, runId: st.runId, name: st.name || `Khách ${PLAYER_ID.slice(0, 4).toUpperCase()}`,
    hero: "", screen: st.over ? "end" : "play",
    stage: Math.max(1, st.qi + 1), stages: st.N,
    stageName: st.left ? "Rời trận" : `Địch còn ${pct}%` + (st.streak >= 2 ? ` · chuỗi ${st.streak}` : ""),
    hp: Math.max(0, st.hearts), maxHp: st.maxHearts, score: st.score,
    result: st.over ? st.result : null,
    correct: st.stats.correct, wrong: st.stats.wrong,
    sec: st.elapsed ?? Math.round((performance.now() - st.t0) / 1000),
  };
}
function sendStatus(force) {
  if (S) lastS = S;
  const st = S || lastS;
  if (!SERVER_MODE || !st) return;
  const now = Date.now();
  if (!force && now - lastSent < 1000) { clearTimeout(sendTimer); sendTimer = setTimeout(() => sendStatus(true), 1000); return; }
  lastSent = now;
  fetch("api/status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(statusPayload(st)), keepalive: true })
    .then((r) => (r.ok && r.status === 200 ? r.json() : null)).then((d) => { if (d && d.watch) startLive(); }).catch(() => {});
}
setInterval(() => { if (S && !S.over) sendStatus(true); }, 3000);

/* Xem trực tiếp: khi màn admin bấm xem người chơi này, gửi ảnh chụp nhỏ của màn chơi khoảng 2 lần/giây */
let liveOn = false;
const liveCv = document.createElement("canvas"), liveCtx = liveCv.getContext("2d");
function liveNote() {
  const vis = (id) => !$(id).hidden;
  if (vis("pickScr")) return "Đang chọn Viện trợ";
  if (vis("leaveScr")) return "Đang tạm dừng";
  if (vis("endScr")) return S || lastS ? `Kết thúc · ${Math.round((S || lastS).score).toLocaleString("vi-VN")} điểm` : "Kết thúc";
  if (vis("startScr")) return "Đang ở màn hình chờ";
  return "";
}
function liveShot() {
  const sw = W * SC * DPR, sh = H * SC * DPR;
  const tw = 460, th = Math.round(tw * H / W);
  liveCv.width = tw; liveCv.height = th;
  liveCtx.drawImage(cv, OX * DPR, OY * DPR, sw, sh, 0, 0, tw, th);
  return liveCv.toDataURL("image/jpeg", 0.62);
}
async function startLive() {
  if (liveOn || !SERVER_MODE) return;
  liveOn = true;
  try {
    for (let miss = 0; miss < 3;) {
      const t0 = performance.now();
      let watch = false;
      try {
        const r = await fetch("api/live", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: PLAYER_ID, img: liveShot(), note: liveNote() }) });
        watch = r.ok && (await r.json()).watch;
      } catch (e) {}
      miss = watch ? 0 : miss + 1;
      await new Promise((ok) => setTimeout(ok, Math.max(120, 500 - (performance.now() - t0))));
    }
  } finally { liveOn = false; }
}

/* ---------------- Vòng lặp ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S && !paused && !S.over) update(dt);
  draw(); updateHum();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitCache.clear());
requestAnimationFrame(frame);
window.__game = () => S; // dùng cho kiểm thử
</script>
